sources:
  reuters:
    name: "Reuters"
    type: "media"
    reliability: "high"
    notes: "Деловое международное агентство. Использовать для фактов, рыночных и регуляторных сообщений; проверять первичными источниками, когда доступно."

  cbr:
    name: "Банк России"
    type: "official"
    reliability: "high"
    notes: "Официальный источник по регуляторным материалам, денежно-кредитной политике, цифровому рублю и финансовой инфраструктуре."

  arxiv:
    name: "arXiv"
    type: "research-preprint"
    reliability: "medium"
    notes: "Preprint-исследования. Использовать как научный сигнал, но не как финальное подтверждение без учёта статуса публикации и методологии."

  github:
    name: "GitHub"
    type: "source-code"
    reliability: "medium"
    notes: "Использовать для анализа публичного кода, релизов, issues и технических изменений. Проверять активность, владельца и статус проекта."

  official_vendor:
    name: "Официальный сайт производителя или сервиса"
    type: "vendor"
    reliability: "medium"
    notes: "Хорошо для спецификаций и анонсов, но требует независимых обзоров и проверок для оценки качества."

  community:
    name: "Публичные сообщества и комментарии"
    type: "community"
    reliability: "low"
    notes: "Использовать только в разделах «Слухи и мнения» или «Мнение людей». Не выдавать за факт."
