name: Regression Tests

on:
  pull_request:
    paths-ignore:
      - "signals/**"
      - "data/**"
      - "validation/**"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check test syntax
        run: python -m py_compile tests/*.py

      - name: Run regression tests
        run: python tests/run_regression_tests.py

      - name: Report automation branch status
        if: ${{ always() && github.event_name == 'workflow_dispatch' && github.ref_name == 'automation/daily-radar' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="${CHECK_STATE}" \
            -f context="regression-tests" \
            -f description="Regression Tests workflow" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
