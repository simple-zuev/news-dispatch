name: Daily Radar

on:
  workflow_dispatch:
    inputs:
      status:
        description: "Dispatch publication status"
        required: false
        default: "draft"
        type: choice
        options:
          - draft
          - published
      max_items:
        description: "Maximum feed items"
        required: false
        default: "24"

permissions:
  contents: write

concurrency:
  group: daily-radar
  cancel-in-progress: false

jobs:
  build-commit:
    runs-on: ubuntu-latest
    env:
      DAILY_RADAR_STATUS: ${{ inputs.status || 'draft' }}
      DAILY_RADAR_MAX_ITEMS: ${{ inputs.max_items || '24' }}
      DAILY_RADAR_MIN_ITEMS: "4"
      DAILY_RADAR_LOOKBACK_HOURS: "24"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync main before generation
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check automation syntax
        run: python -m py_compile tools/stream_registry.py tools/daily_radar.py tools/render_site.py tools/enhance_site.py tools/enrich_media_registry.py tools/apply_media_previews.py tools/apply_reader_sections.py tools/validate_reader_output.py tools/privacy_scan.py

      - name: Disable broad feeds for daily generation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("sources/feeds.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          disabled = {"the-verge-ai"}
          for feed in data.get("feeds", []):
              if feed.get("id") in disabled:
                  feed["enabled"] = False
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Build Daily Radar dispatches
        run: python tools/daily_radar.py

      - name: Validate dispatch front matter
        run: python tools/validate_front_matter.py

      - name: Validate published editorial content
        run: python tools/validate_published.py

      - name: Render static site
        run: python tools/render_site.py

      - name: Enhance static site
        run: python tools/enhance_site.py

      - name: Enrich media registry
        run: python tools/enrich_media_registry.py

      - name: Apply media previews
        run: python tools/apply_media_previews.py

      - name: Apply reader sections
        run: python tools/apply_reader_sections.py

      - name: Validate reader output
        run: python tools/validate_reader_output.py

      - name: Run privacy scan
        run: python tools/privacy_scan.py

      - name: Commit Daily Radar changes
        run: |
          git config user.name "news-dispatch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add signals data validation media
          if git diff --cached --quiet --exit-code; then
            echo "No signal/report changes to commit."
            git reset --hard HEAD
            git clean -fd site dispatches
            exit 0
          fi
          git commit -m "dispatch: update daily radar signals"
          git reset --hard HEAD
          git clean -fd site dispatches
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying after rebase."
            sleep 2
          done
          echo "Daily Radar push failed after retries."
          exit 1
