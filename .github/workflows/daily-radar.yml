name: Daily Radar Signals

on:
  schedule:
    - cron: "55 6 * * *"
  workflow_dispatch:
    inputs:
      max_items:
        description: "Maximum feed items"
        required: false
        default: "24"

permissions:
  contents: write

concurrency:
  group: daily-radar
  cancel-in-progress: false

jobs:
  collect-commit:
    runs-on: ubuntu-latest
    env:
      DAILY_RADAR_MAX_ITEMS: ${{ inputs.max_items || '24' }}
      DAILY_RADAR_MIN_ITEMS: "4"
      DAILY_RADAR_LOOKBACK_HOURS: "24"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync main before generation
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check automation syntax
        run: python -m py_compile tools/stream_registry.py tools/daily_radar.py tools/run_daily_radar_safe.py tools/filter_daily_signals.py tools/privacy_scan.py

      - name: Build Daily Radar signals
        run: python tools/run_daily_radar_safe.py

      - name: Run privacy scan
        run: python tools/privacy_scan.py

      - name: Commit Daily Radar signal changes
        run: |
          git config user.name "news-dispatch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add signals data validation
          if git diff --cached --quiet --exit-code; then
            echo "No signal/report changes to commit."
            git reset --hard HEAD
            exit 0
          fi
          git commit -m "dispatch: update daily radar signals"
          git reset --hard HEAD
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying after rebase."
            sleep 2
          done
          echo "Daily Radar push failed after retries."
          exit 1
