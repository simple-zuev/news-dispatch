name: Hourly Radar

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      max_items:
        description: "Maximum live radar items"
        required: false
        default: "36"
      lookback_hours:
        description: "Lookback window in hours"
        required: false
        default: "8"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hourly-radar
  cancel-in-progress: false

jobs:
  build-commit-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      HOURLY_RADAR_MAX_ITEMS: ${{ inputs.max_items || '36' }}
      HOURLY_RADAR_LOOKBACK_HOURS: ${{ inputs.lookback_hours || '8' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check automation syntax
        run: python -m py_compile tools/stream_registry.py tools/daily_radar.py tools/hourly_radar.py tools/source_health.py tools/apply_topic_streams.py tools/validate_stream_registry.py

      - name: Validate stream registry
        run: python tools/validate_stream_registry.py

      - name: Validate dispatch front matter
        run: python tools/validate_front_matter.py

      - name: Validate published editorial content
        run: python tools/validate_published.py

      - name: Render static site
        run: python tools/render_site.py

      - name: Enhance static site
        run: python tools/enhance_site.py

      - name: Apply topic stream pages
        run: python tools/apply_topic_streams.py

      - name: Apply media previews
        run: python tools/apply_media_previews.py

      - name: Apply reader sections
        run: python tools/apply_reader_sections.py

      - name: Build hourly live radar
        run: python tools/hourly_radar.py

      - name: Build source health report
        run: python tools/source_health.py

      - name: Validate reader output
        run: python tools/validate_reader_output.py

      - name: Run privacy scan
        run: python tools/privacy_scan.py

      - name: Commit Hourly Radar changes
        run: |
          if git diff --quiet --exit-code; then
            echo "No Hourly Radar changes to commit."
            exit 0
          fi
          git config user.name "news-dispatch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add signals data site
          git commit -m "radar: update hourly live radar"
          git push

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
