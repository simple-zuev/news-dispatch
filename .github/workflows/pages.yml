name: Deploy News Dispatch Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check automation syntax
        run: python -m py_compile tools/stream_registry.py tools/apply_topic_streams.py tools/daily_radar.py tools/hourly_radar.py tools/source_health.py tools/validate_stream_registry.py

      - name: Validate stream registry
        run: python tools/validate_stream_registry.py

      - name: Validate dispatch front matter
        run: python tools/validate_front_matter.py

      - name: Validate published editorial content
        run: python tools/validate_published.py

      - name: Render static site
        run: python tools/render_site.py

      - name: Enhance static site
        run: python tools/enhance_site.py

      - name: Apply topic stream pages
        run: python tools/apply_topic_streams.py

      - name: Apply media previews
        run: python tools/apply_media_previews.py

      - name: Apply reader sections
        run: python tools/apply_reader_sections.py

      - name: Render live radar pages
        run: python tools/hourly_radar.py --render-only

      - name: Build source health report
        run: python tools/source_health.py

      - name: Validate reader output
        run: python tools/validate_reader_output.py

      - name: Run privacy scan
        run: python tools/privacy_scan.py

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
