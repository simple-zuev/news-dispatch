name: Deploy News Dispatch Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 1,7,13,19 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Check core syntax
        run: python -m py_compile tools/*.py

      - name: Smoke-test dispatch synthesis
        run: |
          python tools/synthesize_dispatch.py --from-radar validation/daily-radar-latest.json --stream crypto-finance --max-signals 3 --status draft --dry-run > /tmp/synthesis-dry-run.md
          grep -q 'primary_rubric:' /tmp/synthesis-dry-run.md
          grep -q 'issue_type:' /tmp/synthesis-dry-run.md
          grep -q 'publication_mode:' /tmp/synthesis-dry-run.md
          grep -q '## Evidence Ledger' /tmp/synthesis-dry-run.md

      - name: Validate dispatch front matter
        run: python tools/validate_front_matter.py

      - name: Validate source rules
        run: python tools/validate_source_rules.py

      - name: Validate published editorial content
        run: python tools/validate_published.py

      - name: Restore two-week reader history
        id: reader_history
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: validation/public-reader-history-latest.json
          key: public-reader-history-${{ github.run_id }}
          restore-keys: |
            public-reader-history-

      - name: Build static reader site
        run: python3 tools/build_site.py --ranking-mode live --media-mode skip

      - name: Validate reader output
        run: python3 tools/validate_reader_output.py

      - name: Validate render visibility
        run: python3 tools/validate_render_visibility.py

      - name: Run privacy scan
        run: python3 tools/privacy_scan.py

      - name: Run content quality check
        run: python3 tools/validate_public_reader_content_quality.py --fail-on critical

      - name: Validate live reader freshness
        run: python3 tools/validate_public_reader_freshness.py

      - name: Build seven-day reader quality report
        run: python3 tools/build_public_reader_quality_report.py

      - name: Publish reader quality summary
        run: cat validation/public-reader-quality-latest.md >> "$GITHUB_STEP_SUMMARY"

      - name: Save two-week reader history
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: validation/public-reader-history-latest.json
          key: ${{ steps.reader_history.outputs.cache-primary-key }}

      - name: Upload reader quality report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-reader-quality-report
          path: |
            validation/public-reader-quality-latest.json
            validation/public-reader-quality-latest.md
          if-no-files-found: error
          retention-days: 14

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
