name: Deploy News Dispatch Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check core syntax
        run: python -m py_compile tools/*.py

      - name: Smoke-test dispatch synthesis
        run: |
          python tools/synthesize_dispatch.py --from-radar validation/daily-radar-latest.json --stream crypto-finance --max-signals 3 --status draft --dry-run > /tmp/synthesis-dry-run.md
          grep -q 'primary_rubric:' /tmp/synthesis-dry-run.md
          grep -q 'issue_type:' /tmp/synthesis-dry-run.md
          grep -q 'publication_mode:' /tmp/synthesis-dry-run.md
          grep -q '## Evidence Ledger' /tmp/synthesis-dry-run.md

      - name: Validate dispatch front matter
        run: python tools/validate_front_matter.py

      - name: Validate source rules
        run: python tools/validate_source_rules.py

      - name: Validate published editorial content
        run: python tools/validate_published.py

      - name: Build static reader site
        run: python3 tools/build_site.py --ranking-mode live --media-mode skip

      - name: Validate reader output
        run: python3 tools/validate_reader_output.py

      - name: Validate render visibility
        run: python3 tools/validate_render_visibility.py

      - name: Run privacy scan
        run: python3 tools/privacy_scan.py

      - name: Run content quality check
        run: python3 tools/validate_public_reader_content_quality.py --fail-on critical

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
