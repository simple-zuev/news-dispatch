name: Validate News Dispatch

on:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check core syntax
        run: python -m py_compile tools/*.py tests/*.py

      - name: Run signal filter regression tests
        run: python tests/test_filter_daily_signals.py

      - name: Smoke-test dispatch synthesis
        run: |
          python tools/synthesize_dispatch.py --from-radar validation/daily-radar-latest.json --stream crypto-finance --max-signals 3 --status draft --dry-run > /tmp/synthesis-dry-run.md
          grep -q 'primary_rubric:' /tmp/synthesis-dry-run.md
          grep -q 'issue_type:' /tmp/synthesis-dry-run.md
          grep -q 'publication_mode:' /tmp/synthesis-dry-run.md
          grep -q '## Evidence Ledger' /tmp/synthesis-dry-run.md

      - name: Validate dispatch front matter
        run: python tools/validate_front_matter.py

      - name: Validate source rules
        run: python tools/validate_source_rules.py

      - name: Validate published editorial content
        run: python tools/validate_published.py

      - name: Render static site
        run: python tools/render_site.py

      - name: Build radar pages
        run: python tools/build_radar_pages.py

      - name: Build offline radar ranking fixture
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('validation/daily-radar-ranking-latest.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          data = {
              'date': '2026-06-28',
              'report_type': 'daily_radar_ranking',
              'source': 'offline-validation-fixture',
              'selected_keys_count': 1,
              'fetch_errors': [],
              'items': [
                  {
                      'item_key': 'fixture-selected',
                      'feed_id': 'fixture-feed',
                      'feed_title': 'Fixture Regulator',
                      'configured_stream': 'crypto-finance',
                      'routed_stream': 'crypto-finance',
                      'source_class': 'regulator',
                      'source_type': 'official',
                      'language': 'en',
                      'translation_required': True,
                      'title': 'Central bank updates digital asset rules',
                      'url': 'https://example.com/fixture',
                      'published': '2026-06-28T00:00:00+00:00',
                      'final_score': 1.25,
                      'relevance_score': 0.82,
                      'min_relevance_score': 0.45,
                      'include_hits': ['central bank', 'digital asset'],
                      'exclude_hits': [],
                      'boost_hits': ['central bank'],
                      'penalty_hits': [],
                      'stream_keyword_hits': ['digital asset'],
                      'source_rule_status': 'accepted_by_source_rules',
                      'selected': True,
                      'selection_reason': 'selected_top_ranked',
                  },
                  {
                      'item_key': 'fixture-rejected',
                      'feed_id': 'fixture-feed',
                      'feed_title': 'Fixture Source',
                      'configured_stream': 'finance',
                      'routed_stream': '',
                      'source_class': 'public_media',
                      'source_type': 'media',
                      'language': 'en',
                      'translation_required': True,
                      'title': 'Sports item',
                      'url': 'https://example.com/rejected',
                      'published': '2026-06-28T00:00:00+00:00',
                      'final_score': 0.0,
                      'relevance_score': 0.0,
                      'min_relevance_score': 0.45,
                      'include_hits': [],
                      'exclude_hits': ['sports'],
                      'boost_hits': [],
                      'penalty_hits': [],
                      'stream_keyword_hits': [],
                      'source_rule_status': 'rejected_by_exclude_keywords',
                      'selected': False,
                      'selection_reason': 'filtered_by_source_rules',
                  },
              ],
          }
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding='utf-8')
          loaded = json.loads(path.read_text(encoding='utf-8'))
          assert loaded.get('report_type') == 'daily_radar_ranking'
          assert isinstance(loaded.get('items'), list)
          PY

      - name: Build reader policy artifact
        run: python tools/build_reader_policy.py

      - name: Build Today Radar page
        run: python tools/build_today_page.py

      - name: Enhance static site
        run: python tools/enhance_site.py

      - name: Enrich media registry
        run: python tools/enrich_media_registry.py

      - name: Validate media registry
        run: python tools/validate_media_registry.py

      - name: Apply media previews
        run: python tools/apply_media_previews.py

      - name: Apply reader sections
        run: python tools/apply_reader_sections.py

      - name: Apply reader structure
        run: python tools/apply_reader_structure.py

      - name: Apply editorial home layout
        run: python tools/apply_editorial_home_layout.py

      - name: Apply empty states
        run: python tools/apply_empty_states.py

      - name: Validate reader output
        run: python tools/validate_reader_output.py

      - name: Run public safety scan
        run: python tools/privacy_scan.py

      - name: Upload rendered site artifact
        uses: actions/upload-artifact@v4
        with:
          name: news-dispatch-site
          path: site/
          retention-days: 7

      - name: Upload ranking report artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-radar-ranking-report
          path: validation/daily-radar-ranking-latest.json
          retention-days: 7

      - name: Upload reader policy report artifact
        uses: actions/upload-artifact@v4
        with:
          name: reader-policy-report
          path: validation/reader-policy-latest.json
          retention-days: 7
